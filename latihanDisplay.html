<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Display</title>
    <style>
        .kotak {
            width: 50%;
            height: 120px;
            border: 1px solid blue;
            box-sizing: border-box;
        }   
    </style>
    <script language="javascript">
        let tampilkan = () => {
            document.querySelector("#btn2").disabled = false;
            document.querySelector("#btn1").disabled = true;
            document.querySelector("#kotak2").style.display = "block";
        }

        let hilangkan = () => {
            document.querySelector("#btn2").disabled = true;
            document.querySelector("#btn1").disabled = false;
            //document.querySelector("#kotak2").style.display = "none";
            document.querySelector("#kotak2").style.visibility = "hidden";
        }
    </script>

</head>
<body>
    <button id="btn1" disabled onClick="tampilkan()">TAMPIL</button>
    <button id="btn2" onClick="hilangkan()">HILANG</button>
    <div class="kotak kotak1">kotak 1</div>
    <div class="kotak kotak2" id="kotak2">kotak 2</div>
    <div class="kotak kotak3">kotak 3</div>
</body>
</html>
